# One entry per language. Adding a language needs no code changes.
# The root filesystem is read-only, so every cache/temp path in env must point at tmpfs (/tmp or /work).
# tmpfs_mb sizes both /tmp and /work, and tmpfs pages count against the memory limit.

python:
  image: python:3.12-slim
  user: nobody
  source_file: main.py
  run_cmd: [python3, main.py]
  env: [HOME=/tmp, PYTHONDONTWRITEBYTECODE=1]
  run_memory_mb: 256
  tmpfs_mb: 16

node:
  image: node:20-slim
  user: node
  source_file: main.js
  run_cmd: [node, main.js]
  env: [HOME=/tmp]
  run_memory_mb: 256
  tmpfs_mb: 16

c:
  image: gcc:13
  user: nobody
  source_file: main.c
  compile_cmd: [gcc, -O2, main.c, -o, main]
  run_cmd: [./main]
  env: [HOME=/tmp, TMPDIR=/tmp]
  compile_memory_mb: 512
  run_memory_mb: 256
  tmpfs_mb: 64

rust:
  image: rust:1.80-slim
  user: nobody
  source_file: main.rs
  compile_cmd: [rustc, -O, main.rs, -o, main]
  run_cmd: [./main]
  env: [HOME=/tmp, TMPDIR=/tmp]
  compile_memory_mb: 1024
  run_memory_mb: 256
  tmpfs_mb: 128

go:
  image: cic-go:1.22 # built by scripts/images.sh from images/go.Dockerfile
  user: nobody
  source_file: main.go
  compile_cmd: [go, build, -o, main, main.go]
  run_cmd: [./main]
  # GOCACHE is the image's read-only, pre-built std cache; the other values must match
  # images/go.Dockerfile so cache keys hit. GOTOOLCHAIN=local: never try to download a toolchain.
  env: [HOME=/tmp, TMPDIR=/tmp, GOCACHE=/gocache, GOPATH=/tmp/gopath, GOTOOLCHAIN=local, CGO_ENABLED=0]
  compile_memory_mb: 1024
  run_memory_mb: 256
  tmpfs_mb: 64
